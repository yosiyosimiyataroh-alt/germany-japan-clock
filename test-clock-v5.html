.panel:after{content:"";position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}

/* Cover the static clock in the reference with a live clock at the same visual position */
.clock{
 position:absolute;z-index:4;left:50%;top:20.2%;transform:translateX(-50%);
 width:min(60%,460px);aspect-ratio:1;border-radius:50%;
 background:rgba(255,255,255,.88);
 border:2px solid rgba(255,255,255,.96);
 box-shadow:0 10px 26px rgba(16,31,57,.18),inset 0 0 0 1px rgba(111,126,150,.08);
 backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
}
.face{position:absolute;inset:0}
.num{
 position:absolute;transform:translate(-50%,-50%);
 color:#162033;font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
 font-weight:400;font-size:clamp(14px,2.25vw,31px);letter-spacing:-.05em;
}
.mark{
 position:absolute;width:1px;height:5px;background:#738096;opacity:.72;
 transform-origin:50% 50%;
}
.mark.major{height:10px;width:1.4px;background:#263248;opacity:.94}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:999px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.15))}
.hour{width:7px;height:25%;margin-left:-3.5px;background:#111820}
.minute{width:4px;height:36%;margin-left:-2px;background:#111820}
.second{width:1.5px;height:39%;margin-left:-.75px;background:#ef3b2f}
.pin{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#ef3b2f;border:4px solid #252d38}

/* Mask the static digital readout in the reference and replace it with live values */
.bottommask{
 position:absolute;z-index:3;left:0;right:0;bottom:0;height:22%;
 backdrop-filter:blur(1.5px);-webkit-backdrop-filter:blur(1.5px);
}
.de .bottommask{background:linear-gradient(180deg,rgba(64,142,202,.05) 0%,rgba(63,137,191,.35) 27%,rgba(70,137,180,.72) 100%)}
.jp .bottommask{background:linear-gradient(180deg,rgba(25,39,84,.06) 0%,rgba(27,39,83,.46) 25%,rgba(31,40,80,.80) 100%)}

.digital{
 position:absolute;z-index:5;left:50%;bottom:3.4%;transform:translateX(-50%);
 width:92%;text-align:center;color:white;text-shadow:0 2px 9px rgba(0,0,0,.22)
}
.time{font-weight:300;font-size:clamp(28px,5.2vw,66px);letter-spacing:.035em;line-height:1}
.date{margin-top:10px;font-weight:400;font-size:clamp(12px,1.8vw,27px);letter-spacing:.035em}
.footer{display:flex;align-items:center;justify-content:center;font-size:clamp(8px,1.1vw,15px);letter-spacing:.31em;color:#8792a5;white-space:nowrap}
.footer:before,.footer:after{content:"";height:1px;background:#c4cad3;width:56px;margin:0 18px}

@media(max-width:700px){
 .app{grid-template-rows:42px 1fr 24px;padding:0 2px 4px}
 .topdate{font-size:14px}
 .cards{gap:2px}
 .panel{border-radius:0;box-shadow:none}
 .clock{top:34.3%;width:88%;}
 .num{font-size:clamp(13px,4vw,22px)}
 .bottommask{height:22%}
 .digital{bottom:4.3%;width:96%}
 .time{font-size:clamp(25px,7vw,39px)}
 .date{font-size:clamp(10px,2.3vw,13px);margin-top:7px}
 .footer{font-size:7px;letter-spacing:.23em}
 .footer:before,.footer:after{width:30px;margin:0 8px}
}
</style>
</head>
<body>
<div class="app">
  <div class="topdate" id="topDate">----</div>
  <div class="cards">
    <section class="panel de">
      <div class="clock">
        <div class="face" id="deFace"></div>
        <div class="hand hour" id="deHour"></div>
        <div class="hand minute" id="deMinute"></div>
        <div class="hand second" id="deSecond"></div>
        <div class="pin"></div>
      </div>
      <div class="bottommask"></div>
      <div class="digital"><div class="time" id="deTime"></div><div class="date" id="deDate"></div></div>
    </section>
    <section class="panel jp">
      <div class="clock">
        <div class="face" id="jpFace"></div>
        <div class="hand hour" id="jpHour"></div>
        <div class="hand minute" id="jpMinute"></div>
        <div class="hand second" id="jpSecond"></div>
        <div class="pin"></div>
      </div>
      <div class="bottommask"></div>
      <div class="digital"><div class="time" id="jpTime"></div><div class="date" id="jpDate"></div></div>
    </section>
  </div>
  <div class="footer">SAME SKY BEYOND BORDERS</div>
</div>

<script>
function buildFace(id){
 const root=document.getElementById(id);
 for(let i=0;i<60;i++){
   const a=i*6*Math.PI/180;
   const r=i%5===0?44.5:45.8;
   const m=document.createElement('div');
   m.className='mark'+(i%5===0?' major':'');
   m.style.left=(50+Math.sin(a)*r)+'%';
   m.style.top=(50-Math.cos(a)*r)+'%';
   m.style.transform=`translate(-50%,-50%) rotate(${i*6}deg)`;
   root.appendChild(m);
 }
 for(let n=1;n<=12;n++){
   const a=(n*30-90)*Math.PI/180,r=36.5;
   const el=document.createElement('div');el.className='num';el.textContent=n;
   el.style.left=(50+Math.cos(a)*r)+'%';
   el.style.top=(50+Math.sin(a)*r)+'%';
   root.appendChild(el);
 }
}
buildFace('deFace');buildFace('jpFace');

const wd={Mon:'月',Tue:'火',Wed:'水',Thu:'木',Fri:'金',Sat:'土',Sun:'日'};
function parts(zone){
 const f=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});
 return Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
}
function updateOne(prefix,zone){
 const p=parts(zone),h=+p.hour,m=+p.minute,s=+p.second;
 document.getElementById(prefix+'Hour').style.transform=`rotate(${(h%12)*30+m*.5+s/120}deg)`;
 document.getElementById(prefix+'Minute').style.transform=`rotate(${m*6+s*.1}deg)`;
 document.getElementById(prefix+'Second').style.transform=`rotate(${s*6}deg)`;
 document.getElementById(prefix+'Time').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
 document.getElementById(prefix+'Date').textContent=`${p.year}年${+p.month}月${+p.day}日（${wd[p.weekday]}）`;
 return p;
}
function update(){
 const de=updateOne('de','Europe/Berlin');
 updateOne('jp','Asia/Tokyo');
 document.getElementById('topDate').textContent=`${de.year}年${+de.month}月${+de.day}日（${wd[de.weekday]}）`;
}
update();
setInterval(update,1000);
</script>
</body>
</html>
