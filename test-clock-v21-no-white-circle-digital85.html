<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Düsseldorf & Ashiya Live Clock V15</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f6f8fb;font-family:-apple-system,BlinkMacSystemFont,"Avenir Next","Helvetica Neue",Arial,sans-serif;color:#182131}
body{min-height:100dvh}
.wrap{max-width:1200px;margin:0 auto;padding:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel{position:relative;overflow:hidden;border-radius:22px;box-shadow:0 8px 24px rgba(20,35,60,.10)}
.bg{display:block;width:100%;height:auto}

.clock{
 position:absolute;
 left:50%;
 top:20.4%;
 transform:translateX(-50%);
 width:70%;
 aspect-ratio:1;
 border-radius:50%;
 z-index:1;
 background:rgba(255,255,255,.70);
 border:1.5px solid rgba(255,255,255,.95);
 box-shadow:0 8px 20px rgba(0,0,0,.13);

}
.face{position:absolute;inset:0}
.num{
 position:absolute;
 transform:translate(-50%,-50%);
 font-family:"Avenir Next","Helvetica Neue","SF Pro Display",Arial,sans-serif;
 font-size:clamp(12px,1.72vw,24px);
 font-weight:300;
 letter-spacing:-.02em;
 font-variant-numeric:lining-nums tabular-nums;
 font-feature-settings:"tnum" 1,"lnum" 1;
 color:#172033;
}
.tick{
 position:absolute;
 width:.8px;
 height:4px;
 background:#7b8494;
 opacity:.56;
 transform:translate(-50%,-50%);
}
.tick.major{
 width:1.1px;
 height:8px;
 background:#2f394a;
 opacity:.88;
}
.hand{
 position:absolute;
 left:50%;
 bottom:50%;
 transform-origin:50% 100%;
 border-radius:999px;
}
.hour{height:29%;width:3.0px;margin-left:-1.5px;background:#111820}
.minute{height:40%;width:1.7px;margin-left:-.85px;background:#111820}
.second{height:38%;width:.8px;margin-left:-.4px;background:#e53b32}
.pin{
 position:absolute;
 left:50%;
 top:50%;
 width:8px;
 height:8px;
 margin:-4px;
 border-radius:50%;
 background:#111820;
 border:1.5px solid #111820;
}

.digital{
 position:absolute;
 left:50%;
 bottom:2.7%;
 transform:translateX(-50%);
 width:94%;
 text-align:center;
 color:#fff;
 text-shadow:0 2px 8px rgba(0,0,0,.22);
}
.time{
 font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
 font-size:clamp(22px,4.5vw,54px);
 font-weight:300;
 letter-spacing:.025em;
 line-height:1;
 font-variant-numeric:tabular-nums;
}
.date{
 margin-top:9px;
 font-family:"Avenir Next","Helvetica Neue",Arial,sans-serif;
 font-size:clamp(11px,1.65vw,23px);
 font-weight:400;
 letter-spacing:.02em;
}

@media(max-width:700px){
 .wrap{padding:0}
 .grid{gap:2px}
 .panel{border-radius:0;box-shadow:none}
 .clock{top:19.0%;width:70%}
 .num{font-size:clamp(11px,3.0vw,17px);font-weight:300}
 .tick{height:3px}
 .tick.major{height:7px}
 .hour{width:2.6px;margin-left:-1.3px}
 .minute{width:1.5px;margin-left:-.75px}
 .second{width:.75px;margin-left:-.375px}
 .time{font-size:clamp(20px,5.95vw,33px);font-weight:300;letter-spacing:.015em}
 .date{font-size:clamp(10px,2.25vw,13px);margin-top:6px}
}


</style>
</head>

        <div class="time" id="jpTime"></div>
        <div class="date" id="jpDate"></div>
      </div>
    </section>
  </div>
</div>

<script>
function buildFace(id){
 const root=document.getElementById(id);

 for(let i=0;i<60;i++){
   const a=i*6*Math.PI/180;
   const r=i%5===0?44.6:45.9;
   const t=document.createElement('div');
   t.className='tick'+(i%5===0?' major':'');
   t.style.left=(50+Math.sin(a)*r)+'%';
   t.style.top=(50-Math.cos(a)*r)+'%';
   t.style.transform=`translate(-50%,-50%) rotate(${i*6}deg)`;
   root.appendChild(t);
 }

 for(let n=1;n<=12;n++){
   const a=(n*30-90)*Math.PI/180;
   const r=36.0;
   const el=document.createElement('div');
   el.className='num';
   el.textContent=n;
   el.style.left=(50+Math.cos(a)*r)+'%';
   el.style.top=(50+Math.sin(a)*r)+'%';
   root.appendChild(el);
 }
}

buildFace('deFace');
buildFace('jpFace');

const wd={Mon:'月',Tue:'火',Wed:'水',Thu:'木',Fri:'金',Sat:'土',Sun:'日'};

function getParts(zone){
 const f=new Intl.DateTimeFormat('en-GB',{
   timeZone:zone,
   hour12:false,
   year:'numeric',
   month:'2-digit',
   day:'2-digit',
   weekday:'short',
   hour:'2-digit',
   minute:'2-digit',
   second:'2-digit'
 });
 return Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
}

function updateClock(prefix,zone){
 const p=getParts(zone);
 const h=+p.hour, m=+p.minute, s=+p.second;

 document.getElementById(prefix+'Hour').style.transform=
   `rotate(${(h%12)*30 + m*.5 + s/120}deg)`;
 document.getElementById(prefix+'Minute').style.transform=
   `rotate(${m*6 + s*.1}deg)`;
 document.getElementById(prefix+'Second').style.transform=
   `rotate(${s*6}deg)`;

 document.getElementById(prefix+'Time').textContent=
   `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

 document.getElementById(prefix+'Date').textContent=
   `${p.year}年${+p.month}月${+p.day}日（${wd[p.weekday]}）`;
}

function tick(){
 updateClock('de','Europe/Berlin');
 updateClock('jp','Asia/Tokyo');
}
tick();
setInterval(tick,1000);
</script>
</body>
</html>
