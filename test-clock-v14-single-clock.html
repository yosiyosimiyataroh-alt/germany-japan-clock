<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Düsseldorf & Ashiya Live Clock V14</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Avenir Next","Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:14px 8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel{position:relative;overflow:hidden;border-radius:22px}
.bg{display:block;width:100%;height:auto}
.live-clock{
 position:absolute;left:50%;top:20.2%;transform:translateX(-50%);
 width:60.3%;aspect-ratio:1;border-radius:50%;
 background:rgba(255,255,255,.86);
 border:2px solid rgba(255,255,255,.98);
 box-shadow:0 10px 26px rgba(0,0,0,.16);
 backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
}
.num{position:absolute;transform:translate(-50%,-50%);color:#182131;font-size:clamp(13px,2.1vw,29px);font-weight:400;letter-spacing:-.04em}
.tick{position:absolute;transform:translate(-50%,-50%);width:1px;height:5px;background:#7a8494;opacity:.65}
.tick.major{width:1.5px;height:10px;background:#263248;opacity:.95}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:999px}
.hour{height:25%;width:6px;margin-left:-3px;background:#111820}
.minute{height:36%;width:4px;margin-left:-2px;background:#111820}
.second{height:39%;width:1.5px;margin-left:-.75px;background:#ef3b2f}
.pin{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;border-radius:50%;background:#ef3b2f;border:4px solid #252d38}
.digital{position:absolute;left:50%;bottom:2.7%;transform:translateX(-50%);width:94%;text-align:center;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.22)}
.time{font-size:clamp(25px,5vw,62px);font-weight:300;letter-spacing:.03em;line-height:1}
.date{font-size:clamp(11px,1.7vw,24px);margin-top:10px}
@media(max-width:700px){
 .wrap{padding:0}
 .grid{gap:2px}
 .panel{border-radius:0}
 .num{font-size:clamp(12px,3.6vw,20px)}
 .time{font-size:clamp(23px,6.8vw,38px)}
 .date{font-size:clamp(10px,2.3vw,13px);margin-top:6px}
}
</style>
</head>

  <div class="live-clock">
    <div id="jpFace"></div>
    <div class="hand hour" id="jpHour"></div>
    <div class="hand minute" id="jpMinute"></div>
    <div class="hand second" id="jpSecond"></div>
    <div class="pin"></div>
  </div>
  <div class="digital"><div class="time" id="jpTime"></div><div class="date" id="jpDate"></div></div>
</section>
</div></div>
<script>
function face(id){
 const root=document.getElementById(id); root.style.position='absolute'; root.style.inset='0';
 for(let i=0;i<60;i++){
  const a=i*6*Math.PI/180,r=i%5===0?44.5:45.8;
  const e=document.createElement('div'); e.className='tick'+(i%5===0?' major':'');
  e.style.left=(50+Math.sin(a)*r)+'%';e.style.top=(50-Math.cos(a)*r)+'%';
  e.style.transform=`translate(-50%,-50%) rotate(${i*6}deg)`;root.appendChild(e);
 }
 for(let n=1;n<=12;n++){
  const a=(n*30-90)*Math.PI/180,r=36.4;
  const e=document.createElement('div');e.className='num';e.textContent=n;
  e.style.left=(50+Math.cos(a)*r)+'%';e.style.top=(50+Math.sin(a)*r)+'%';root.appendChild(e);
 }
}
face('deFace');face('jpFace');
const wd={Mon:'月',Tue:'火',Wed:'水',Thu:'木',Fri:'金',Sat:'土',Sun:'日'};
function parts(zone){
 const f=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});
 return Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
}
function update(prefix,zone){
 const p=parts(zone),h=+p.hour,m=+p.minute,s=+p.second;
 document.getElementById(prefix+'Hour').style.transform=`rotate(${(h%12)*30+m*.5+s/120}deg)`;
 document.getElementById(prefix+'Minute').style.transform=`rotate(${m*6+s*.1}deg)`;
 document.getElementById(prefix+'Second').style.transform=`rotate(${s*6}deg)`;
 document.getElementById(prefix+'Time').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
 document.getElementById(prefix+'Date').textContent=`${p.year}年${+p.month}月${+p.day}日（${wd[p.weekday]}）`;
}
function tick(){update('de','Europe/Berlin');update('jp','Asia/Tokyo')}
tick();setInterval(tick,1000);
</script>
