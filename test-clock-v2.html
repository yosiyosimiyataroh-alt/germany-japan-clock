<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Düsseldorf & Ashiya Clock</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:#08111f;color:white;overflow:hidden}
.wrap{width:100%;height:100vh;display:grid;grid-template-columns:1fr 1fr}
.panel{
  position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:18px 6px 22px;transition:background 1s ease,color 1s ease;
}
.de.day{background:linear-gradient(180deg,#4db5ff 0%,#a7ddff 45%,#fbe2a7 72%,#d4b07b 100%)}
.de.night{background:linear-gradient(180deg,#07152d 0%,#112f61 50%,#17213e 100%)}
.jp.day{background:linear-gradient(180deg,#62bdff 0%,#d7edff 46%,#ffe0e6 74%,#eec8ca 100%)}
.jp.night{background:linear-gradient(180deg,#09142e 0%,#1a2f63 49%,#43275f 100%)}

.glow{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 5%,rgba(255,255,255,.25),transparent 28%)}
.stars{position:absolute;inset:0;opacity:0;transition:opacity 1s;pointer-events:none}
.night .stars{opacity:.9}
.stars:before{
  content:"";position:absolute;width:2px;height:2px;border-radius:50%;background:white;
  box-shadow:24px 40px white,74px 74px white,140px 34px white,205px 102px white,260px 58px white,
  320px 120px white,388px 46px white,440px 89px white,38px 165px white,120px 205px white,
  228px 180px white,348px 220px white;
}
.sunmoon{position:absolute;right:7%;top:5%;width:50px;height:50px;border-radius:50%;transition:all 1s}
.day .sunmoon{background:#ffd84b;box-shadow:0 0 24px rgba(255,216,75,.5)}
.night .sunmoon{background:#e7edff;box-shadow:-10px 6px 0 #10234b,0 0 18px rgba(231,237,255,.18)}

.cityscape{position:absolute;left:0;right:0;bottom:0;height:26%;z-index:1;pointer-events:none}
.water{position:absolute;left:0;right:0;bottom:0;height:40%;background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(10,30,55,.35));border-top:1px solid rgba(255,255,255,.2)}
.de .water:after{content:"";position:absolute;left:8%;right:8%;top:18%;height:2px;background:rgba(255,255,255,.3);box-shadow:0 11px rgba(255,255,255,.14),0 23px rgba(255,255,255,.08)}
.jp .water:after{content:"";position:absolute;left:5%;right:5%;top:20%;height:2px;background:rgba(255,255,255,.28);box-shadow:0 13px rgba(255,255,255,.12),0 26px rgba(255,255,255,.06)}

.de .landmark{position:absolute;left:13%;bottom:29%;width:9px;height:62%;background:#172237;border-radius:5px 5px 0 0}
.de .landmark:before{content:"";position:absolute;left:50%;top:-14%;width:22px;height:22px;transform:translateX(-50%);border-radius:50%;background:#172237;box-shadow:0 -16px 0 -7px #172237}
.de .bridge{position:absolute;left:40%;bottom:34%;width:52%;height:18%;border-top:4px solid #172237;border-radius:50% 50% 0 0;transform:skewX(-12deg)}
.de .bridge:before,.de .bridge:after{content:"";position:absolute;bottom:-24px;width:4px;height:38px;background:#172237}
.de .bridge:before{left:22%}.de .bridge:after{right:18%}
.de .buildings{position:absolute;left:0;right:0;bottom:30%;height:24%;background:
linear-gradient(90deg,#172237 0 6%,transparent 6% 8%,#172237 8% 17%,transparent 17% 20%,#172237 20% 29%,transparent 29% 33%,#172237 33% 40%,transparent 40% 46%,#172237 46% 55%,transparent 55% 59%,#172237 59% 70%,transparent 70% 75%,#172237 75% 84%,transparent 84% 88%,#172237 88% 100%)}

.jp .hills{position:absolute;left:0;right:0;bottom:39%;height:42%;background:#19243b;clip-path:polygon(0 100%,12% 76%,24% 66%,38% 74%,51% 56%,66% 68%,82% 45%,100% 58%,100% 100%)}
.jp .buildings{position:absolute;left:0;right:0;bottom:29%;height:28%;background:
linear-gradient(90deg,#1a243a 0 8%,transparent 8% 10%,#1a243a 10% 18%,transparent 18% 21%,#1a243a 21% 31%,transparent 31% 34%,#1a243a 34% 45%,transparent 45% 49%,#1a243a 49% 59%,transparent 59% 62%,#1a243a 62% 73%,transparent 73% 78%,#1a243a 78% 88%,transparent 88% 91%,#1a243a 91% 100%)}
.jp .sakura{position:absolute;right:3%;bottom:22%;width:88px;height:88px}
.jp .sakura:before{
 content:"🌸";position:absolute;font-size:35px;right:0;top:0;
 text-shadow:-25px 16px 0 rgba(255,205,220,.8),-50px 4px 0 rgba(255,190,210,.65),-38px 42px 0 rgba(255,205,220,.7)
}

.header{position:relative;z-index:3;text-align:center;margin-bottom:10px}
.flag{font-size:29px;line-height:1}
.country{font-weight:850;font-size:clamp(17px,3vw,34px);letter-spacing:.06em}
.city{font-size:clamp(10px,1.5vw,16px);letter-spacing:.13em;margin-top:2px}
.badge{display:inline-block;margin-top:7px;padding:5px 8px;border-radius:999px;background:rgba(0,0,0,.16);border:1px solid rgba(255,255,255,.28);font-size:10px;backdrop-filter:blur(8px)}

.clock{
 position:relative;z-index:3;width:min(40vw,320px);aspect-ratio:1;border-radius:50%;
 background:#fff;border:5px solid rgba(255,255,255,.92);box-shadow:0 16px 36px rgba(0,0,0,.22),inset 0 0 0 8px rgba(15,23,42,.04)
}
.num{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#111827;font-weight:800;font-size:clamp(13px,2vw,21px)}
.mark{position:absolute;left:50%;top:50%;width:2px;height:7px;background:#111827;transform-origin:50% 0}
.mark.major{width:3px;height:12px}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:999px}
.hour{width:7px;height:25%;margin-left:-3.5px;background:#111827}
.minute{width:5px;height:35%;margin-left:-2.5px;background:#111827}
.second{width:2px;height:39%;margin-left:-1px;background:#e11d48}
.pin{position:absolute;left:50%;top:50%;width:15px;height:15px;margin:-7.5px;border-radius:50%;background:#111827;box-shadow:inset 0 0 0 4px #e11d48}

.digital{position:relative;z-index:3;margin-top:12px;width:min(92%,320px);padding:9px 5px;text-align:center;border-radius:15px;background:rgba(7,18,46,.28);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px)}
.time{font-size:clamp(22px,4vw,44px);font-weight:850;letter-spacing:.03em}
.date{font-size:clamp(9px,1.4vw,13px);margin-top:3px}
.tagline{position:fixed;z-index:5;left:50%;bottom:6px;transform:translateX(-50%);font-size:9px;letter-spacing:.28em;opacity:.66;white-space:nowrap}

@media(max-width:640px){
 .panel{padding:14px 4px 18px}
 .flag{font-size:24px}.country{font-size:16px}.city{font-size:9px}.badge{font-size:8px;padding:4px 6px}
 .clock{width:43vw}.digital{width:96%;padding:7px 2px}.time{font-size:20px}.date{font-size:9px}
 .tagline{display:none}
}
</style>
</head>
<body>
<div class="wrap">
<section class="panel de" id="dePanel">
 <div class="glow"></div><div class="stars"></div><div class="sunmoon"></div>
 <div class="cityscape"><div class="water"></div><div class="buildings"></div><div class="bridge"></div><div class="landmark"></div></div>
 <div class="header"><div class="flag">🇩🇪</div><div class="country">GERMANY</div><div class="city">DÜSSELDORF</div><div class="badge" id="deBadge"></div></div>
 <div class="clock"><div id="deFace"></div><div class="hand hour" id="deHour"></div><div class="hand minute" id="deMinute"></div><div class="hand second" id="deSecond"></div><div class="pin"></div></div>
 <div class="digital"><div class="time" id="deTime"></div><div class="date" id="deDate"></div></div>
</section>

<section class="panel jp" id="jpPanel">
 <div class="glow"></div><div class="stars"></div><div class="sunmoon"></div>
 <div class="cityscape"><div class="hills"></div><div class="water"></div><div class="buildings"></div><div class="sakura"></div></div>
 <div class="header"><div class="flag">🇯🇵</div><div class="country">JAPAN</div><div class="city">ASHIYA</div><div class="badge" id="jpBadge"></div></div>
 <div class="clock"><div id="jpFace"></div><div class="hand hour" id="jpHour"></div><div class="hand minute" id="jpMinute"></div><div class="hand second" id="jpSecond"></div><div class="pin"></div></div>
 <div class="digital"><div class="time" id="jpTime"></div><div class="date" id="jpDate"></div></div>
</section>
</div>
<div class="tagline">SAME SKY BEYOND BORDERS</div>

<script>
function buildFace(id){
 const root=document.getElementById(id);
 for(let i=0;i<60;i++){
  const m=document.createElement('div');m.className='mark'+(i%5===0?' major':'');
  const a=i*6*Math.PI/180,r=45;
  m.style.left=(50+Math.sin(a)*r)+'%';
  m.style.top=(50-Math.cos(a)*r)+'%';
  m.style.transform=`translate(-50%,-50%) rotate(${i*6}deg)`;
  root.appendChild(m);
 }
 for(let n=1;n<=12;n++){
  const el=document.createElement('div');el.className='num';el.textContent=n;
  const a=(n*30-90)*Math.PI/180,r=38.5;
  el.style.left=(50+Math.cos(a)*r)+'%';el.style.top=(50+Math.sin(a)*r)+'%';
  root.appendChild(el);
 }
}
buildFace('deFace');buildFace('jpFace');

function getParts(zone){
 const f=new Intl.DateTimeFormat('en-GB',{timeZone:zone,hour12:false,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',second:'2-digit'});
 return Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
}
function updateOne(prefix,panelId,zone){
 const p=getParts(zone),h=+p.hour,m=+p.minute,s=+p.second;
 document.getElementById(prefix+'Hour').style.transform=`rotate(${(h%12)*30+m*.5}deg)`;
 document.getElementById(prefix+'Minute').style.transform=`rotate(${m*6+s*.1}deg)`;
 document.getElementById(prefix+'Second').style.transform=`rotate(${s*6}deg)`;
 document.getElementById(prefix+'Time').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
 const wd={Mon:'月',Tue:'火',Wed:'水',Thu:'木',Fri:'金',Sat:'土',Sun:'日'};
 document.getElementById(prefix+'Date').textContent=`${p.year}年${+p.month}月${+p.day}日（${wd[p.weekday]}）`;
 const day=h>=6&&h<18,panel=document.getElementById(panelId);
 panel.classList.toggle('day',day);panel.classList.toggle('night',!day);
 document.getElementById(prefix+'Badge').textContent=day?'☀️ DAY':'🌙 NIGHT';
}
function update(){updateOne('de','dePanel','Europe/Berlin');updateOne('jp','jpPanel','Asia/Tokyo')}
update();setInterval(update,1000);
</script>
</body>
</html>
